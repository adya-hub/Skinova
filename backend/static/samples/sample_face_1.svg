<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F5F2"/>
      <stop offset="100%" stop-color="#E1EBE4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9DFC7"/>
      <stop offset="100%" stop-color="#EFC0A4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="480" rx="16" fill="url(#bg)"/>
  
  <!-- Hair back -->
  <path d="M120 100 Q200 40 280 100 Q320 220 310 320 Q290 380 280 440 L120 440 Q110 380 90 320 Z" fill="#2C2320"/>
  
  <!-- Neck & Shoulders -->
  <path d="M165 310 L165 380 Q165 420 80 460 L320 460 Q235 420 235 380 L235 310 Z" fill="#E2B193"/>
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="220" rx="85" ry="115" fill="url(#skin)"/>
  
  <!-- Ears -->
  <circle cx="112" cy="225" r="14" fill="#E8B59A"/>
  <circle cx="288" cy="225" r="14" fill="#E8B59A"/>
  
  <!-- Hair Front -->
  <path d="M120 140 Q160 85 200 88 Q240 85 280 140 Q250 110 200 110 Q150 110 120 140 Z" fill="#3D302C"/>
  <path d="M115 140 Q125 180 120 230 Q112 180 115 140 Z" fill="#3D302C"/>
  <path d="M285 140 Q275 180 280 230 Q288 180 285 140 Z" fill="#3D302C"/>
  
  <!-- Eyes -->
  <path d="M150 195 Q168 186 182 195" stroke="#3D302C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M218 195 Q232 186 250 195" stroke="#3D302C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="166" cy="204" rx="5" ry="6" fill="#3D302C"/>
  <ellipse cx="234" cy="204" rx="5" ry="6" fill="#3D302C"/>
  
  <!-- Nose -->
  <path d="M198 215 Q200 240 194 246 Q200 250 206 246" stroke="#D19E80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks subtle flush -->
  <circle cx="152" cy="245" r="18" fill="#F09B8B" opacity="0.3" filter="url(#glow)"/>
  <circle cx="248" cy="245" r="18" fill="#F09B8B" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Lips -->
  <path d="M178 280 Q200 274 222 280 Q200 292 178 280 Z" fill="#D98A7B"/>
  
  <!-- Visible T-Zone Shine / Highlights -->
  <ellipse cx="200" cy="155" rx="28" ry="12" fill="#FFFFFF" opacity="0.45" filter="url(#glow)"/>
  <ellipse cx="200" cy="235" rx="8" ry="16" fill="#FFFFFF" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Visible minor blemishes (annotations) -->
  <circle cx="175" cy="248" r="3.5" fill="#D66B60" opacity="0.8"/>
  <circle cx="225" cy="254" r="3" fill="#D66B60" opacity="0.75"/>
  <circle cx="195" cy="172" r="2.8" fill="#D66B60" opacity="0.7"/>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="160" height="28" rx="14" fill="#2D5A46" opacity="0.9"/>
  <text x="100" y="38" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sample A: Combination</text>
</svg>
