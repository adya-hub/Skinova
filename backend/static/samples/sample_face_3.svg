<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="100%" stop-color="#E2E2E8"/>
    </linearGradient>
    <linearGradient id="skin3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A482"/>
      <stop offset="100%" stop-color="#BA8462"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="16" fill="url(#bg3)"/>
  
  <!-- Hair back -->
  <path d="M100 80 Q200 20 300 80 Q340 220 330 360 L70 360 Q60 220 100 80 Z" fill="#1C1816"/>
  
  <!-- Neck & Shoulders -->
  <path d="M165 310 L165 380 Q165 420 80 460 L320 460 Q235 420 235 380 L235 310 Z" fill="#B37C5B"/>
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="220" rx="86" ry="114" fill="url(#skin3)"/>
  
  <!-- Ears -->
  <circle cx="112" cy="225" r="14" fill="#B8815F"/>
  <circle cx="288" cy="225" r="14" fill="#B8815F"/>
  
  <!-- Hair Front -->
  <path d="M110 130 Q160 70 200 75 Q240 70 290 130 Q250 95 200 95 Q150 95 110 130 Z" fill="#241E1C"/>
  
  <!-- Eyes -->
  <path d="M150 196 Q168 188 184 196" stroke="#241E1C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M216 196 Q232 188 250 196" stroke="#241E1C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="167" cy="204" rx="5" ry="6" fill="#241E1C"/>
  <ellipse cx="233" cy="204" rx="5" ry="6" fill="#241E1C"/>
  
  <!-- Nose -->
  <path d="M198 215 Q200 242 194 248 Q200 252 206 248" stroke="#9C6B4B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Visible Hyperpigmentation / Post-Blemish spots (PIH) -->
  <circle cx="160" cy="242" r="4.5" fill="#784930" opacity="0.6"/>
  <circle cx="168" cy="256" r="3.8" fill="#784930" opacity="0.55"/>
  <circle cx="238" cy="248" r="4.2" fill="#784930" opacity="0.5"/>
  <circle cx="246" cy="260" r="3.2" fill="#784930" opacity="0.6"/>
  <circle cx="188" cy="165" r="3.5" fill="#784930" opacity="0.5"/>
  <circle cx="215" cy="172" r="3.0" fill="#784930" opacity="0.45"/>
  
  <!-- Lips -->
  <path d="M178 284 Q200 278 222 284 Q200 295 178 284 Z" fill="#995850"/>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="180" height="28" rx="14" fill="#2D5A46" opacity="0.9"/>
  <text x="110" y="38" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sample C: Visible Pigmentation</text>
</svg>
